name: Firmware, release and web flasher

# Pushes to main and PRs: build and test both firmwares and the site (CI only).
# A v* tag: the same, then a GitHub Release with both firmware files and a Pages deploy carrying exactly those files.
on:
  push:
    branches: [main]
    tags: ['v*'] # path filters are not evaluated for tag pushes
    paths:
      - 'USBGPIB-STM32/web/**'
      - 'USBGPIB-STM32/Firmware/**'
      - 'USBGPIB-STM32/bootloader/**'
      - 'LANGPIB-WCH/Firmware/**'
      - 'gpib-core/**'
      - '.gitmodules'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'USBGPIB-STM32/web/**'
      - 'USBGPIB-STM32/Firmware/**'
      - 'USBGPIB-STM32/bootloader/**'
      - 'LANGPIB-WCH/Firmware/**'
      - 'gpib-core/**'
      - '.gitmodules'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  stm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build and test
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          make -C USBGPIB-STM32/Firmware
          make -C USBGPIB-STM32/Firmware bootloader
          make -C USBGPIB-STM32/Firmware test HOSTCC=gcc
      - uses: actions/upload-artifact@v7
        with:
          name: stm32
          path: USBGPIB-STM32/Firmware/build/usbgpib.bin
          if-no-files-found: error

  wch:
    runs-on: ubuntu-latest
    env:
      XPACK: 15.2.0-1 # riscv-none-elf-gcc, as in LANGPIB-WCH/docs/firmware.md
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - id: cache
        uses: actions/cache@v6
        with:
          path: ~/opt/xpack-riscv-none-elf-gcc-${{ env.XPACK }}
          key: xpack-riscv-none-elf-gcc-${{ env.XPACK }}-linux-x64
      - name: Install the xPack toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          f=xpack-riscv-none-elf-gcc-$XPACK-linux-x64.tar.gz
          url=https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v$XPACK/$f
          curl -fsSLO "$url"
          curl -fsSLO "$url.sha"
          sha256sum -c "$f.sha"
          mkdir -p ~/opt
          tar -xzf "$f" -C ~/opt
      - name: Build and test # the Makefile finds the toolchain in ~/opt
        run: |
          make -C LANGPIB-WCH/Firmware
          make -C LANGPIB-WCH/Firmware test
      - uses: actions/upload-artifact@v7
        with:
          name: wch
          path: LANGPIB-WCH/Firmware/build/langpib.dfu
          if-no-files-found: error

  web:
    needs: [stm32, wch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: fw
      - name: Firmware into the site
        id: fw
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          stm32="USBGPIB-STM32-$v.bin"
          wch="LANGPIB-WCH-$v.dfu"
          dir=USBGPIB-STM32/web/public/firmware
          mkdir -p "$dir"
          cp fw/stm32/usbgpib.bin "$dir/$stm32"
          cp fw/wch/langpib.dfu "$dir/$wch"
          printf '{"version":"%s","commit":"%s","date":"%s","files":{"stm32":"%s","wch":"%s"}}\n' \
            "$v" "$GITHUB_SHA" "$(date -u +%Y-%m-%d)" "$stm32" "$wch" > "$dir/info.json"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "stm32=$dir/$stm32" >> "$GITHUB_OUTPUT"
          echo "wch=$dir/$wch" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: USBGPIB-STM32/web/package-lock.json
      - name: Web app
        working-directory: USBGPIB-STM32/web
        env: # the image tests also check these real files
          STM32_BIN: ${{ github.workspace }}/${{ steps.fw.outputs.stm32 }}
          WCH_DFU: ${{ github.workspace }}/${{ steps.fw.outputs.wch }}
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: |
            ${{ steps.fw.outputs.stm32 }}
            ${{ steps.fw.outputs.wch }}
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: USBGPIB-STM32/web/dist

  release:
    needs: web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes

  deploy: # off until Pages is enabled: set the repo variable PAGES_ENABLED to true
    needs: [web, release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
